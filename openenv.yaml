apiVersion: openenv/v1
kind: Environment

metadata:
  name: ContentModeration-v1
  version: 1.0.0
  description: >-
    Stateful hybrid AI content moderation environment with multi-level tasks.

spec:
  runtime:
    type: fastapi
    base_url: http://127.0.0.1:8000
    health_endpoint: /health
    action_endpoint: /step
    demo_endpoint: /demo
    port: 8000

  observation_schema:
    title: Observation
    type: object
    additionalProperties: false
    required: [text, metadata]
    properties:
      text: {type: string}
      metadata:
        type: object
        additionalProperties: true
        required: [channel, reports, severity, level]
        properties:
          channel: {type: string}
          reports: {type: integer, minimum: 0}
          severity: {type: string, enum: [low, medium, high]}
          level: {type: string, enum: [easy, medium, hard]}

  action_schema:
    title: Action
    type: object
    additionalProperties: false
    required: [label, action]
    properties:
      label: {type: string, enum: [safe, spam, hate, violence]}
      action: {type: string, enum: [allow, delete, flag, escalate]}

  tasks:
    - id: easy
      name: Easy Moderation
      difficulty: easy
      description: Spam-focused moderation samples.
      grader:
        type: scalar
        score_field: info.task_score
        score_range: {min: 0.01, max: 0.99}
    - id: medium
      name: Medium Moderation
      difficulty: medium
      description: Hate and abusive content detection.
      grader:
        type: scalar
        score_field: info.task_score
        score_range: {min: 0.01, max: 0.99}
    - id: hard
      name: Hard Moderation
      difficulty: hard
      description: Context-aware and multi-step moderation edge cases.
      grader:
        type: scalar
        score_field: info.task_score
        score_range: {min: 0.01, max: 0.99}